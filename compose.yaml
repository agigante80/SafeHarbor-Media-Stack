# SafeHarbor Media Stack - Docker Compose Configuration
# 
# This setup provides a complete VPN-protected media automation stack:
# - All media containers route traffic through VPN (Gluetun)
# - External access via mapped ports on host network
# - Internal container communication via localhost (shared network stack)
# - Isolated monitoring system with Telegram notifications
# - Synology NAS compatible configuration
#
# Prerequisites:
# 1. Copy .env.example to .env and configure your values
# 2. Ensure Docker and Docker Compose are installed
# 3. Configure VPN provider credentials in .env file
# 4. Set up Telegram bot (optional) for monitoring
# 5. Ensure volume directories exist with proper permissions
#
# External Access Ports:
# - qBittorrent:  http://YOUR_SERVER_IP:9802
# - Jackett:      http://YOUR_SERVER_IP:9803  
# - Sonarr:       http://YOUR_SERVER_IP:9804
# - Prowlarr:     http://YOUR_SERVER_IP:9805
# - FlareSolverr: http://YOUR_SERVER_IP:9806
# - Readarr:      http://YOUR_SERVER_IP:9808
# - Radarr:       http://YOUR_SERVER_IP:9809
# - Bazarr:       http://YOUR_SERVER_IP:9810
# - Keepalive:    http://YOUR_SERVER_IP:5421
# - Watcharr:     http://YOUR_SERVER_IP:3811  (NOT behind the VPN - see below)

version: "3"

services:
  # =============================================================================
  # VPN GATEWAY - All media traffic routes through this container
  # =============================================================================
  gluetun:
    # Version notes for Synology DS220+:
    # - v3.40.4 and earlier: Work without sysctls
    # - v3.41.0 and later: REQUIRE sysctls (see below) for Synology NAS
    # Breaking change occurred between v3.40.4 → v3.41.0
    image: qmcgaw/gluetun:v3.40.4  # Last version working without sysctls on Synology
    container_name: vpn-media-gluetun
    cap_add:
      - NET_ADMIN  # Required for VPN tunnel creation
    devices:
      - /dev/net/tun:/dev/net/tun  # TUN device for VPN tunnel
    # sysctls not needed for v3.40.4 and earlier
    # For v3.41.0+, add:
    # sysctls:
    #   - net.ipv4.conf.all.src_valid_mark=1
    #   - net.ipv6.conf.all.disable_ipv6=0
    ports:
      # BitTorrent ports for qBittorrent
      - 9801:6881      # qBittorrent TCP port
      - 9801:6881/udp  # qBittorrent UDP port
      # Media application web interfaces (external:internal)
      - 9802:8085      # qBittorrent WebUI
      - 9803:9117      # Jackett indexer proxy
      - 9804:8989      # Sonarr TV shows management
      - 9805:9696      # Prowlarr indexer manager  
      - 9806:8191      # FlareSolverr Cloudflare bypass
      - 9808:8787      # Readarr books management
      - 9809:7878      # Radarr movies management
      - 9810:6767      # Bazarr subtitles management
    volumes:
      - ${VOLUME_DOCKER_PROJECT}/gluetun:/gluetun  # VPN config and logs
    environment:
      # VPN Provider Configuration (from .env file)
      - UPDATER_PERIOD=${UPDATER_PERIOD}              # How often to check for updates
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}  # VPN provider name
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}          # Preferred server countries
      - OPENVPN_USER=${VPN_USER}                      # VPN username
      - OPENVPN_PASSWORD=${VPN_PASSWORD}              # VPN password
      # Network Configuration
      - FIREWALL_OUTBOUND_SUBNETS=10.50.0.0/16,10.51.0.0/16  # Allow internal communication
    networks:
      - media-internal  # Connected to internal network for monitoring
    restart: always

  # =============================================================================
  # MEDIA STACK - All containers share Gluetun's VPN network
  # =============================================================================
  
  # BitTorrent Download Client
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: vpn-media-qbittorrent
    environment:
      - PUID=${PUID_MEDIA}       # User ID for file permissions
      - PGID=${PGID_MEDIA}       # Group ID for file permissions
      - TZ=${TZ}                 # Timezone setting
      - WEBUI_PORT=8085          # Internal web interface port
    volumes:
      - ${VOLUME_DOCKER_PROJECT}/qbittorrent/config:/config  # Configuration storage
      # USB-backed. Short-form binds AUTO-CREATE a missing host path, which on an
      # unmounted drive means downloading onto the 2.3G root partition. These
      # long-form binds fail to start instead.
      # NOTE this is a backstop, not a guarantee: it only catches a MISSING path.
      # An empty leftover directory still satisfies it.
      - type: bind
        source: ${VOLUME_DOWNLOADS}                          # Completed downloads
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${VOLUME_INCOMPLETE}                         # Incomplete downloads
        target: /incomplete
        bind:
          create_host_path: false
    network_mode: service:gluetun  # Share Gluetun's VPN network stack
    depends_on:
      - gluetun
    restart: unless-stopped

  # Cloudflare Bypass Service
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: vpn-media-flaresolverr
    environment:
      - PUID=${PUID_MEDIA}      # User ID for file permissions
      - PGID=${PGID_MEDIA}      # Group ID for file permissions
      - TZ=${TZ}                # Timezone setting
      - TEST_URL=${TEST_URL}    # URL for connectivity testing
      - LANG=${LANG}            # Language setting
    volumes:
      - ${VOLUME_DOCKER_PROJECT}/flaresolverr/config:/config
    network_mode: service:gluetun  # Share Gluetun's VPN network stack
    depends_on:
      - gluetun
    restart: unless-stopped

  # Torrent Indexer Proxy
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: vpn-media-jackett
    environment:
      - PUID=${PUID_MEDIA}
      - PGID=${PGID_MEDIA}
      - TZ=${TZ}
      - AUTO_UPDATE=true
      - RUN_OPTS=
    volumes:
      - ${VOLUME_DOCKER_PROJECT}/jackett/config:/config
      - ${VOLUME_DOCKER_PROJECT}/jackett/downloads:/downloads
    network_mode: service:gluetun
    depends_on:
      - gluetun
      - flaresolverr
    restart: unless-stopped

  # Indexer Manager (Modern Jackett Alternative)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: vpn-media-prowlarr
    environment:
      - PUID=${PUID_MEDIA}
      - PGID=${PGID_MEDIA}
      - TZ=${TZ}
    volumes:
      - ${VOLUME_DOCKER_PROJECT}/prowlarr/config:/config
    network_mode: service:gluetun
    depends_on:
      - gluetun
    restart: unless-stopped

  # TV Show Automation (*arr Applications)
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: vpn-media-sonarr
    environment:
      - PUID=${PUID_MEDIA}
      - PGID=${PGID_MEDIA}
      - TZ=${TZ}
    volumes:
      - ${VOLUME_DOCKER_PROJECT}/sonarr/config:/config
      # USB-backed — refuse to start rather than auto-create on the root partition.
      - type: bind
        source: ${VOLUME_DOWNLOADS}
        target: /downloads
        bind:
          create_host_path: false
      # /volume1/media is a SEPARATE btrfs subvolume (dev 39 vs /volume1's 38), so it CAN be
      # absent independently of /volume1. Guarded, so a missing path makes the container
      # fail to start rather than silently import completed downloads into an
      # auto-created stub.
      - type: bind
        source: ${VOLUME_MEDIA}
        target: /media/media
        bind:
          create_host_path: false
    network_mode: service:gluetun
    depends_on:
      - gluetun
    restart: unless-stopped

  # Movie Automation
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: vpn-media-radarr
    environment:
      - PUID=${PUID_MEDIA}
      - PGID=${PGID_MEDIA}
      - TZ=${TZ}
    volumes:
      - ${VOLUME_DOCKER_PROJECT}/radarr/config:/config
      # USB-backed — refuse to start rather than auto-create on the root partition.
      - type: bind
        source: ${VOLUME_DOWNLOADS}
        target: /downloads
        bind:
          create_host_path: false
      # /volume1/media is a SEPARATE btrfs subvolume (dev 39 vs /volume1's 38), so it CAN be
      # absent independently of /volume1. Guarded, so a missing path makes the container
      # fail to start rather than silently import completed downloads into an
      # auto-created stub.
      - type: bind
        source: ${VOLUME_MEDIA}
        target: /media/media
        bind:
          create_host_path: false
    network_mode: service:gluetun
    depends_on:
      - gluetun
    restart: unless-stopped

  # Book and Audiobook Automation  
#  readarr:
#    image: lscr.io/linuxserver/readarr:develop
#    container_name: readarr
#    environment:
#      - PUID=${PUID_MEDIA}
#      - PGID=${PGID_MEDIA}
#      - TZ=${TZ}
#    volumes:
#      - ${VOLUME_DOCKER_PROJECT}/readarr/config:/config
#      - ${VOLUME_DOWNLOADS}:/downloads
#      - ${VOLUME_EBOOKS}:/ebooks
#      - ${VOLUME_AUDIOBOOKS}:/audiobooks
#      - ${VOLUME_IMPORT}:/ImportFolder
#      - ${VOLUME_AUDIOBOOKSHELF}:/audiobookshelf
#    network_mode: service:gluetun
#    depends_on:
#      - gluetun
#    restart: unless-stopped

  # Subtitle Automation
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: vpn-media-bazarr
    environment:
      - PUID=${PUID_MEDIA}
      - PGID=${PGID_MEDIA}
      - TZ=${TZ}
    volumes:
      - ${VOLUME_DOCKER_PROJECT}/bazarr/config:/config
      # Guarded like sonarr/radarr. It MUST be: a short-form bind here would
      # auto-create an empty /volume1/media, which then satisfies their
      # create_host_path:false check and lets them import into the stub - the
      # guard would be defeated by its own sibling.
      - type: bind
        source: ${VOLUME_MEDIA}
        target: /media/media
        bind:
          create_host_path: false
    network_mode: service:gluetun
    depends_on:
      - gluetun
    restart: unless-stopped

  # =============================================================================
  # VPN MONITORING SYSTEM - Telegram notifications for VPN status
  # =============================================================================
  vpn-sentinel-client:
    image: agigante80/vpn-sentinel-client:latest
    network_mode: service:gluetun  # Shares VPN network
    container_name: vpn-media-sentinel-client
    environment:
      # Required: Server connection
      - VPN_SENTINEL_URL=${VPN_SENTINEL_URL}
      - VPN_SENTINEL_API_KEY=${VPN_SENTINEL_API_KEY}

      # Optional: Client identification
      - VPN_SENTINEL_CLIENT_ID=${VPN_SENTINEL_CLIENT_ID}
      - VPN_SENTINEL_API_PATH=${VPN_SENTINEL_API_PATH}
      - TZ=${TZ}
      # Optional: Health check intervals
      - HEALTH_CHECK_INTERVAL=300  # seconds
    # Shares gluetun's network namespace, so it CANNOT start before gluetun
    # exists. Without this, a cold `up -d` can schedule the VPN alerting client
    # first and it fails to start exactly when you most want alerts.
    depends_on:
      - gluetun
    restart: unless-stopped
    # Off Synology's `db` log driver (heavy btrfs metadata writes; its log lock can leak and wedge dockerd).
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

  # =============================================================================
  # WATCH TRACKER - Self-hosted Trakt replacement (movies/TV/anime/games)
  # =============================================================================
  # Deliberately NOT network_mode: service:gluetun. Publishing its port would
  # mean adding it to gluetun's `ports:`, and gluetun cannot be recreated
  # without stranding every container in its network namespace. There is also nothing to hide
  # here: it talks to TMDB and Trakt, both of which behave worse from a shared
  # VPN exit IP (rate limits, Cloudflare challenges). Sitting on
  # media-internal instead means it survives VPN reconnects and can be added
  # or updated with `up -d --no-deps watcharr` without touching the stack.
  watcharr:
    # Pinned: watchtower is running on this host, and Watcharr ships breaking
    # changes often enough that an unattended jump to :latest is a bad trade.
    # Check https://github.com/sbondCo/Watcharr/releases before bumping.
    image: ghcr.io/sbondco/watcharr:v4.2.1
    container_name: vpn-media-watcharr
    ports:
      - 3811:3080  # Web UI
    volumes:
      # SQLite database + image cache. On volume1, not the USB drive, so this
      # is not one of the create_host_path:false guarded services.
      - ${VOLUME_DOCKER_PROJECT}/watcharr/data:/data
    environment:
      - TZ=${TZ}
    networks:
      - media-internal
    restart: unless-stopped

# =============================================================================
# NETWORK CONFIGURATION - Custom networks for proper isolation
# =============================================================================
networks:
  # Internal network for Gluetun VPN gateway
  # Used for communication between VPN container and monitoring
  media-internal:
    driver: bridge
    name: media-internal
    ipam:
      config:
        - subnet: 10.50.0.0/16  # Internal subnet for media services
  